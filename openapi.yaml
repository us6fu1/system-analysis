openapi: 3.0.3
info:
  title: AI History Helper API
  version: 0.2.0
  description: |
    Учебный TO-BE-контракт для возможной серверной версии.
    В текущем десктопном приложении этот API не реализован.
servers:
  - url: http://localhost:8000/api

paths:
  /textbooks:
    get:
      summary: Получить список учебников
      operationId: listTextbooks
      parameters:
        - name: grade
          in: query
          description: Фильтр по классу
          schema:
            type: integer
            minimum: 5
            maximum: 11
      responses:
        '200':
          description: Список доступных учебников
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Textbook'
              example:
                - id: 1
                  title: История Древнего мира
                  grade: 5
        '500':
          $ref: '#/components/responses/InternalError'

  /tests:
    get:
      summary: Получить историю тестов
      operationId: listTests
      parameters:
        - name: textbookId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: topic
          in: query
          description: Поиск по части названия темы
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница истории тестов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPage'
              example:
                items:
                  - id: 42
                    textbookId: 1
                    topic: Древний Египет
                    difficulty: medium
                    variantCount: 2
                    createdAt: '2026-05-21T18:40:00Z'
                total: 1
                limit: 20
                offset: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Создать тест
      description: Генерация выполняется синхронно. Успешный ответ содержит готовый тест.
      operationId: createTest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestRequest'
            example:
              textbookId: 1
              topic: Древний Египет
              difficulty: medium
              variantCount: 2
              questionCounts:
                test: 6
                open: 2
                match: 1
                chronology: 1
      responses:
        '201':
          description: Тест создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
              example:
                id: 42
                textbookId: 1
                topic: Древний Египет
                difficulty: medium
                variantCount: 1
                variants:
                  - variantNumber: 1
                    questions:
                      - position: 1
                        replacedFromQuestionId: null
                        question:
                          id: 810
                          questionType: test
                          topic: Древний Египет
                          difficulty: medium
                          text: Какую роль играл Нил в жизни Древнего Египта?
                          options:
                            - Был основой земледелия
                            - Отделял Египет от Средиземного моря
                          correctAnswer: Был основой земледелия
                          sourcePage: '78'
                createdAt: '2026-05-21T18:40:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Для заданных параметров недостаточно вопросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_ENOUGH_QUESTIONS
                message: Для открытых заданий найден только один вопрос из двух
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /tests/{testId}:
    get:
      summary: Получить тест
      operationId: getTest
      parameters:
        - $ref: '#/components/parameters/TestId'
      responses:
        '200':
          description: Тест найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tests/{testId}/variants/{variantNumber}/questions/{position}/replace:
    post:
      summary: Заменить один вопрос варианта
      description: Замена применяется только после успешного поиска нового вопроса.
      operationId: replaceQuestion
      parameters:
        - $ref: '#/components/parameters/TestId'
        - $ref: '#/components/parameters/VariantNumber'
        - $ref: '#/components/parameters/Position'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceQuestionRequest'
            example:
              comment: Нужен другой вопрос по той же теме
      responses:
        '200':
          description: Вопрос заменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestQuestion'
              example:
                position: 6
                replacedFromQuestionId: 802
                question:
                  id: 845
                  questionType: test
                  topic: Древний Египет
                  difficulty: medium
                  text: Почему разливы Нила были важны для земледелия?
                  options: []
                  correctAnswer: Они делали почву плодородной
                  sourcePage: '81'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Подходящая замена не найдена, исходный вопрос не изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: REPLACEMENT_NOT_FOUND
                message: В банке нет другого вопроса подходящего типа и сложности
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /tests/{testId}/variants/{variantNumber}/exports:
    post:
      summary: Создать DOCX для выбранного варианта
      operationId: createExport
      parameters:
        - $ref: '#/components/parameters/TestId'
        - $ref: '#/components/parameters/VariantNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
            example:
              className: 5Б
              includeAnswers: false
              includeExplanations: false
              includeAnswerSheet: true
      responses:
        '201':
          description: DOCX создан, файл доступен по downloadUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResult'
              example:
                id: 501
                testId: 42
                variantNumber: 1
                fileName: Test_Drevniy_Egipet_V1.docx
                downloadUrl: http://localhost:8000/api/exports/501/file
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /exports/{exportId}/file:
    get:
      summary: Скачать созданный DOCX
      operationId: downloadExport
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Файл DOCX
          headers:
            Content-Disposition:
              description: Имя скачиваемого файла
              schema:
                type: string
                example: attachment; filename="Test_Drevniy_Egipet_V1.docx"
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    TestId:
      name: testId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    VariantNumber:
      name: variantNumber
      in: path
      required: true
      description: Номер варианта, начиная с 1
      schema:
        type: integer
        minimum: 1
    Position:
      name: position
      in: path
      required: true
      description: Позиция вопроса, начиная с 1
      schema:
        type: integer
        minimum: 1
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Ошибка входных данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Укажите тему и хотя бы один тип задания
    NotFound:
      description: Запрошенный ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: Тест или вариант не найден
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Не удалось обработать запрос
    ServiceUnavailable:
      description: Сервис подбора вопросов или экспорта временно недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SERVICE_UNAVAILABLE
            message: Локальная модель не загружена

  schemas:
    Textbook:
      type: object
      required: [id, title, grade]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        grade:
          type: integer
          minimum: 5
          maximum: 11

    CreateTestRequest:
      type: object
      additionalProperties: false
      required: [textbookId, topic, difficulty, variantCount, questionCounts]
      properties:
        textbookId:
          type: integer
          format: int64
          minimum: 1
        topic:
          type: string
          minLength: 1
          maxLength: 200
        difficulty:
          type: string
          enum: [easy, medium, hard]
        variantCount:
          type: integer
          minimum: 1
          maximum: 10
        questionCounts:
          $ref: '#/components/schemas/QuestionCounts'

    QuestionCounts:
      type: object
      description: Хотя бы для одного типа нужно указать число больше нуля
      additionalProperties: false
      properties:
        test:
          type: integer
          minimum: 0
          default: 0
        open:
          type: integer
          minimum: 0
          default: 0
        match:
          type: integer
          minimum: 0
          default: 0
        chronology:
          type: integer
          minimum: 0
          default: 0

    ReplaceQuestionRequest:
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
          maxLength: 300

    ExportRequest:
      type: object
      additionalProperties: false
      properties:
        className:
          type: string
          maxLength: 30
          example: 5Б
        includeAnswers:
          type: boolean
          default: false
        includeExplanations:
          type: boolean
          default: false
        includeAnswerSheet:
          type: boolean
          default: false

    Question:
      type: object
      required: [id, questionType, text, difficulty]
      properties:
        id:
          type: integer
          format: int64
        questionType:
          type: string
          enum: [test, open, match, chronology]
        topic:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        text:
          type: string
        options:
          type: array
          items:
            type: string
        correctAnswer:
          type: string
          nullable: true
        sourcePage:
          type: string
          nullable: true

    TestQuestion:
      type: object
      required: [position, question]
      properties:
        position:
          type: integer
          minimum: 1
        replacedFromQuestionId:
          type: integer
          format: int64
          nullable: true
        question:
          $ref: '#/components/schemas/Question'

    TestVariant:
      type: object
      required: [variantNumber, questions]
      properties:
        variantNumber:
          type: integer
          minimum: 1
        questions:
          type: array
          items:
            $ref: '#/components/schemas/TestQuestion'

    Test:
      type: object
      required: [id, textbookId, topic, difficulty, variantCount, variants, createdAt]
      properties:
        id:
          type: integer
          format: int64
        textbookId:
          type: integer
          format: int64
        topic:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        variantCount:
          type: integer
          minimum: 1
        variants:
          type: array
          items:
            $ref: '#/components/schemas/TestVariant'
        createdAt:
          type: string
          format: date-time

    TestSummary:
      type: object
      required: [id, textbookId, topic, difficulty, variantCount, createdAt]
      properties:
        id:
          type: integer
          format: int64
        textbookId:
          type: integer
          format: int64
        topic:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        variantCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    TestPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TestSummary'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer

    ExportResult:
      type: object
      required: [id, testId, variantNumber, fileName, downloadUrl]
      properties:
        id:
          type: integer
          format: int64
        testId:
          type: integer
          format: int64
        variantNumber:
          type: integer
        fileName:
          type: string
        downloadUrl:
          type: string
          format: uri

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
